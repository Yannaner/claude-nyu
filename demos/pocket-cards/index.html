<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Turn notes into flashcards."><title>Pocket · Concept demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#20211f;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d67450;outline-offset:3px}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;max-width:1050px;margin:auto;padding:26px 24px}.logo{font-weight:800;letter-spacing:-.05em;font-size:22px}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6d6b65}.wrap{max-width:1050px;margin:auto;padding:52px 24px 80px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#ad5036}h1{font-size:clamp(44px,7vw,78px);letter-spacing:-.065em;line-height:1;margin:15px 0}h2{letter-spacing:-.04em}.sub{font-size:17px;line-height:1.6;color:#696861;max-width:580px}.panel{background:#fff;border:1px solid #e7e4dc;border-radius:24px;padding:clamp(24px,4vw,40px);box-shadow:0 16px 50px #2c261008}.btn{border:0;border-radius:99px;background:#242422;color:#fff;padding:13px 22px;font-weight:650}.btn:hover{background:#ad5036}.secondary{background:#efede7;color:#30302d}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:42px}.label{display:block;font-size:12px;font-weight:700;margin:0 0 8px;color:#65635d}input,textarea{border:1px solid #dedbd2;border-radius:12px;background:#faf9f6;padding:12px;width:100%;color:#242422}textarea{resize:vertical}footer{max-width:1050px;margin:auto;padding:24px;border-top:1px solid #dedbd2;color:#747169;font-size:12px;line-height:1.6}.hint{color:#77736b;font-size:13px;line-height:1.5}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding-top:40px}header{padding-top:20px}.tag{font-size:9px}}body{background:#ececf7}.eyebrow{color:#6950a8}.card{display:flex;min-height:360px;width:100%;flex-direction:column;justify-content:space-between;align-items:flex-start;border:0;border-radius:24px;background:#6c5a9b;color:#fff;padding:32px;text-align:left}.card span,.card small{font-size:11px;letter-spacing:.16em}.card strong{font-size:clamp(25px,4vw,40px);line-height:1.2;letter-spacing:-.03em;overflow-wrap:anywhere}.controls{margin-top:16px}.gap{margin-top:18px}button:disabled{opacity:.55;cursor:not-allowed}body{background:#ece8fc;color:#25203f}.wrap{max-width:1100px;padding-top:30px}.hero-graphic{float:right;width:42%;height:260px;border-radius:24px;background:#5b4a83 url('/art.webp') center/cover;margin:0 0 30px 45px}.grid{clear:both;grid-template-columns:.75fr 1.25fr;align-items:start}.grid>section:first-child{order:2}.grid>section:last-child{order:1}.card{background:#6652a0;border-radius:38px;min-height:480px;box-shadow:10px 12px 0 #c8b9e9}.panel{border:0;border-radius:38px;background:#f9f7ff}.btn{background:#342b56}.logo{font-family:Georgia,serif;font-size:28px;letter-spacing:-.04em}.eyebrow{color:#6f55a5}footer{border-color:#cfc8df}@media(max-width:700px){.hero-graphic{float:none;width:100%;height:200px;margin:0 0 24px}.grid{grid-template-columns:1fr}.grid>section:first-child{order:1}.grid>section:last-child{order:2}.card{min-height:320px}}</style></head><body><header><a href="/" class="logo">✳ Pocket</a><span class="tag">A concept demo</span></header><main class="wrap"><div class="hero-graphic" aria-hidden="true"></div><div class="eyebrow">Study smarter / 02</div><h1>Small cards.<br>Big ideas.</h1><p class="sub">Make a deck in seconds, then test what you know.</p><div class="grid"><section><button id="card" class="card" aria-label="Flip card"><span id="side">QUESTION</span><strong id="content">Create your first card →</strong><small>Click to flip</small></button><div class="row controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="next">Next →</button><button class="btn secondary" id="remove">Delete card</button></div><p id="count" class="hint" aria-live="polite">No cards yet.</p></section><section class="panel"><div class="eyebrow">Your deck</div><h2>Add a card</h2><form id="form"><label class="label" for="question">Question</label><textarea id="question" rows="3" maxlength="300" required placeholder="What do you want to remember?"></textarea><label class="label gap" for="answer">Answer</label><textarea id="answer" rows="3" maxlength="600" required placeholder="Write the answer here"></textarea><button class="btn gap" type="submit">Add to deck +</button></form><p class="hint">Saved only in this browser.</p></section></div></main><footer>Showcase prototype · No AI service connected<br>Built for the Claude at NYU showcase. <a href="https://claude-nyu.vercel.app/#build">Back to the club ↗</a></footer><script>let cards=[];try{const data=JSON.parse(localStorage.getItem('pocket-cards')||'[]');if(Array.isArray(data))cards=data.filter(x=>typeof x.q==='string'&&typeof x.a==='string')}catch{}let index=0,flipped=false;const content=document.querySelector('#content'),side=document.querySelector('#side'),count=document.querySelector('#count');function save(){try{localStorage.setItem('pocket-cards',JSON.stringify(cards))}catch{}}function draw(){const c=cards[index];content.textContent=c?(flipped?c.a:c.q):'Create your first card →';side.textContent=flipped?'ANSWER':'QUESTION';count.textContent=c?`Card ${index+1} of ${cards.length}`:'No cards yet.';for(const id of ['card','prev','next','remove'])document.getElementById(id).disabled=!cards.length}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#question'),a=document.querySelector('#answer');if(!q.value.trim()||!a.value.trim())return;cards.push({q:q.value.trim(),a:a.value.trim()});index=cards.length-1;flipped=false;save();draw();e.target.reset()};document.querySelector('#card').onclick=()=>{flipped=!flipped;draw()};document.querySelector('#prev').onclick=()=>{index=(index-1+cards.length)%cards.length;flipped=false;draw()};document.querySelector('#next').onclick=()=>{index=(index+1)%cards.length;flipped=false;draw()};document.querySelector('#remove').onclick=()=>{cards.splice(index,1);index=Math.max(0,Math.min(index,cards.length-1));flipped=false;save();draw()};draw();</script></body></html>
